[package]
name = "twin-k8s"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }

kube = { version = "4.2", default-features = false, features = ["client", "config", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "io"] }

[dev-dependencies]
twin-fixtures = { workspace = true }
tempfile = { workspace = true }
