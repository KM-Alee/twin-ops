name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build static binary
        run: cross build --release --locked -p twin-cli --target ${{ matrix.target }}
      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          arch="${{ matrix.target }}"
          arch="${arch%%-*}"
          name="twin-${version}-${arch}-linux"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/twin" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "arch=${arch}" >> "$GITHUB_OUTPUT"
      - name: Smoke test (x86_64 only)
        if: startsWith(matrix.target, 'x86_64')
        run: |
          bin=target/${{ matrix.target }}/release/twin
          file "$bin" | grep -qE "static(-pie)? linked"
          for image in debian:12 ubuntu:24.04 fedora:41 archlinux:latest alpine:3.20; do
            docker run --rm -v "$PWD/$bin:/usr/local/bin/twin:ro" "$image" \
              sh -c 'twin --version && twin init >/dev/null && twin scan >/dev/null && twin preflight "ls"'
          done
      - name: Debian and RPM packages (x86_64 only)
        if: startsWith(matrix.target, 'x86_64')
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb -p twin-cli --no-build --target ${{ matrix.target }} --output dist/
          cargo generate-rpm -p crates/twin-cli --target ${{ matrix.target }} --output dist/
          (cd dist && for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.package.outputs.arch }}
          path: dist/*.*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: cat dist/*.sha256 > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
            install.sh
          generate_release_notes: true

  image:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Unpack static binaries
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pair in x86_64:amd64 aarch64:arm64; do
            arch="${pair%%:*}"; docker_arch="${pair##*:}"
            mkdir -p "dist/${docker_arch}"
            tar -xzf "artifacts/twin-${version}-${arch}-linux.tar.gz" -C artifacts
            cp "artifacts/twin-${version}-${arch}-linux/twin" "dist/${docker_arch}/twin"
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/km-alee/twin:${{ steps.version.outputs.version }}
            ghcr.io/km-alee/twin:latest
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/km-alee/twin
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  mcp-registry:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check server.json matches this release
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq -e --arg v "$version" '.version == $v and .packages[0].identifier == ("ghcr.io/km-alee/twin:" + $v)' server.json
      - name: Publish to the MCP registry
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
